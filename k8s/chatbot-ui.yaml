apiVersion: v1
kind: Namespace
metadata:
  name: chatbot-ui
---
apiVersion: v1
kind: Secret
metadata:
  namespace: chatbot-ui
  name: chatbot-ui
type: Opaque
data:
  OPENAI_API_KEY: c2stcHJvai1wc0o0bGNCamQ2MHFDc0pZM1dpZHlOVWZhX0pBcDI5WHlOZEt3RlpEMTZ1ZkE3VW1P
MTVzZmQxaGh3OEdDZ2o0UkF6T2c2ZzN5SFQzQmxia0ZKTThTV3lidGttWm5zOUlsVzJkUmJyQ0NR
